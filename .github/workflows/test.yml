name: test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: character-studio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm test
